apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: test-predictor-metrics-metrics
  ownerReferences:
    - kind: Instance
      name: test-predictor-metrics
spec:
  selector:
    matchLabels:
      core.openeverest.io/instance: test-predictor-metrics
      core.openeverest.io/component: predictor
  podMetricsEndpoints:
    - path: /metrics
      (contains(relabelings[].sourceLabels[], '__meta_kubernetes_pod_annotation_prometheus_kserve_io_port')): true
      (contains(relabelings[].sourceLabels[], '__meta_kubernetes_pod_annotation_prometheus_kserve_io_path')): true
