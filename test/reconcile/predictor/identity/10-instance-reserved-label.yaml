apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-predictor-identity-reserved
spec:
  providerRef:
    name: provider-kserve
  topology:
    type: predictor
  components:
    predictor:
      type: modelServer
      replicas: 1
      parameters:
        modelFormat: sklearn
        storageURI: gs://kfserving-examples/models/sklearn/1.0/model
        labels:
          core.openeverest.io/instance: someone-else
