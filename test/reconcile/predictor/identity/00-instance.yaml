apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-predictor-identity
spec:
  providerRef:
    name: provider-kserve
  topology:
    type: predictor
  components:
    predictor:
      type: modelServer
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
      parameters:
        modelFormat: sklearn
        storageURI: gs://kfserving-examples/models/sklearn/1.0/model
        serviceAccountName: model-reader
        labels:
          cost-center: ml
        annotations:
          example.com/owner: ml-platform
        securityContext:
          runAsNonRoot: true
        containerSecurityContext:
          allowPrivilegeEscalation: false
