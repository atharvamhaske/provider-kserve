apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-predictor-hf
spec:
  providerRef:
    name: provider-kserve
  topology:
    type: predictor
  components:
    predictor:
      type: modelServer
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
      parameters:
        modelFormat: huggingface
        storageURI: hf://sentence-transformers/all-MiniLM-L6-v2
        args: ($args)
