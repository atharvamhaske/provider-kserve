apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: test-predictor-catalog-gpu
spec:
  predictor:
    model:
      modelFormat:
        name: huggingface
      storageUri: hf://Qwen/Qwen3-Embedding-0.6B
      args:
        - --task=text_embedding
        - --runner=pooling
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          memory: 8Gi
    tolerations:
      - key: nvidia.com/gpu
        operator: Exists
        effect: NoSchedule
    deploymentStrategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 1
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-predictor-catalog-gpu-predictor
spec:
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  template:
    spec:
      (tolerations[?key == 'nvidia.com/gpu']):
        - operator: Exists
          effect: NoSchedule
