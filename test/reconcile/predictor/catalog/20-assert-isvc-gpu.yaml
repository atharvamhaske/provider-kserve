apiVersion: serving.kserve.io/v1beta1
kind: InferenceService
metadata:
  name: test-predictor-catalog-gpu
spec:
  predictor:
    model:
      modelFormat:
        name: huggingface
      storageUri: hf://Qwen/Qwen3-Embedding-0.6B
      args:
        - --task=text_embedding
        - --runner=pooling
      resources:
        limits:
          nvidia.com/gpu: "1"
        requests:
          memory: 8Gi
