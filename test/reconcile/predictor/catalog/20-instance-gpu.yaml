apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-predictor-catalog-gpu
spec:
  providerRef:
    name: provider-kserve
  topology:
    type: predictor
  components:
    predictor:
      type: modelServer
      replicas: 1
      resources:
        limits:
          cpu: "2"
          memory: 8Gi
      parameters:
        model: qwen3-embedding-0.6b
