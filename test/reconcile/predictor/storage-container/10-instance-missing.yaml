apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-predictor-csc-missing
spec:
  providerRef:
    name: provider-kserve
  topology:
    type: predictor
  components:
    predictor:
      type: modelServer
      replicas: 1
      resources:
        limits:
          cpu: "1"
          memory: 2Gi
      parameters:
        modelFormat: sklearn
        storageURI: gs://kfserving-examples/models/sklearn/1.0/model
        storageContainer: chainsaw-predictor-init-late
