apiVersion: core.openeverest.io/v1alpha1
kind: Instance
metadata:
  name: test-predictor-sklearn
spec:
  providerRef:
    name: provider-kserve
  topology:
    type: predictor
  components:
    predictor:
      type: modelServer
      replicas: 1
      resources:
        requests:
          cpu: 100m
          memory: 512Mi
        limits:
          cpu: "1"
          memory: 1Gi
      parameters:
        modelFormat: sklearn
        storageURI: gs://kfserving-examples/models/sklearn/1.0/model
