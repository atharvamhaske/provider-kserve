  check.py: |
    import json, math, sys, urllib.request
    ref = json.load(open("/ref/reference.json"))
    body = json.dumps({"model": sys.argv[2], "input": ref["texts"]}).encode()
    req = urllib.request.Request(sys.argv[1] + "/openai/v1/embeddings", body, {"Content-Type": "application/json"})
    got = [d["embedding"] for d in json.load(urllib.request.urlopen(req, timeout=60))["data"]]
    def cos(a, b):
        return sum(x * y for x, y in zip(a, b)) / math.sqrt(sum(x * x for x in a) * sum(y * y for y in b))
    print(json.dumps({"dim": len(got[0]), "minCosine": min(cos(g, r) for g, r in zip(got, ref["vectors"]))}))
