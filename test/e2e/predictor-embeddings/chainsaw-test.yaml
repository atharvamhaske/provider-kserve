apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: predictor-embeddings
spec:
  description: |
    Serve a small sentence-embedding model on CPU through the huggingface
    runtime: the Instance becomes Ready, its connection Secret names the model
    and the in-cluster address, and /openai/v1/embeddings returns the same
    384-d vectors as sentence-transformers for that model.
  catch:
    - script:
        content: |
          kubectl -n $NAMESPACE get instance,inferenceservice,pod -o wide
          kubectl -n $NAMESPACE logs -l serving.kserve.io/inferenceservice=test-predictor-minilm --all-containers --tail=50
  steps:
    - name: ready
      try:
        - apply:
            file: 00-instance.yaml
        - assert:
            file: 00-assert-ready.yaml

    - name: embed-through-connection-details
      try:
        - apply:
            file: 01-reference.yaml
        - script:
            content: |
              set -eu
              secret=$(kubectl -n "$NAMESPACE" get instance test-predictor-minilm -o jsonpath='{.status.connectionSecretRef.name}')
              uri=$(kubectl -n "$NAMESPACE" get secret "$secret" -o jsonpath='{.data.uri}' | base64 -d)
              model=$(kubectl -n "$NAMESPACE" get secret "$secret" -o jsonpath='{.data.model}' | base64 -d)
              # Read the result from pod logs: `kubectl run -i` can echo stdout twice.
              # --overrides replaces the container, so the endpoint goes in as arguments.
              kubectl -n "$NAMESPACE" run embed --restart=Never --quiet --image=python:3.12-slim \
                --overrides="{\"spec\":{\"volumes\":[{\"name\":\"ref\",\"configMap\":{\"name\":\"embedding-reference\"}}],\"containers\":[{\"name\":\"embed\",\"image\":\"python:3.12-slim\",\"command\":[\"python\",\"/ref/check.py\",\"$uri\",\"$model\"],\"volumeMounts\":[{\"name\":\"ref\",\"mountPath\":\"/ref\"}]}]}}" >/dev/null
              kubectl -n "$NAMESPACE" wait pod/embed --for=jsonpath='{.status.phase}'=Succeeded --timeout=3m >/dev/null
              kubectl -n "$NAMESPACE" logs embed
            check:
              ($error): ~
              (json_parse($stdout).dim): 384
              (json_parse($stdout).minCosine > `0.999`): true
